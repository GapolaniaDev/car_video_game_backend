# ─────────────────────────────────────────────────────────────────────
# docker-compose.yml — full local stack for the racing-game-backend MVP.
#
# Services:
#   * postgres       — persistent DB (internal only)
#   * migrate        — one-shot runner that applies SQL migrations and exits
#   * backend-api    — REST API on internal :8080
#   * game-server    — UDP game server on internal :7000 (exposed to host)
#   * nginx          — reverse proxy on host :80
#   * cloudflared    — optional Cloudflare Tunnel (Spec 22)
#
# All services share the `racing-network` bridge network. Secrets are
# loaded from `.env` (which must NEVER be committed).
# ─────────────────────────────────────────────────────────────────────

name: racing-game-backend

# ─── Defaults applied to every service ────────────────────────────────
x-defaults: &defaults
  restart: unless-stopped
  networks:
    - racing-network

services:

  # ─── postgres ───────────────────────────────────────────────────────
  postgres:
    <<: *defaults
    image: postgres:16-alpine
    container_name: racing-postgres
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    # No `ports:` — internal only.

  # ─── migrate (one-shot) ─────────────────────────────────────────────
  # Runs SQL migrations against the healthy Postgres, then exits 0.
  # backend-api waits for this to succeed before starting.
  migrate:
    image: migrate/migrate:v4.18.1
    container_name: racing-migrate
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - racing-network
    volumes:
      - ./migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      - "up"
    restart: "no"

  # ─── backend-api ────────────────────────────────────────────────────
  backend-api:
    <<: *defaults
    build:
      context: .
      dockerfile: Dockerfile.api
    image: racing-game-backend/api:dev
    container_name: racing-backend-api
    environment:
      APP_ENV:                  ${APP_ENV}
      LOG_LEVEL:                ${LOG_LEVEL}
      API_PORT:                 "8080"
      POSTGRES_HOST:            postgres
      POSTGRES_PORT:            "5432"
      POSTGRES_DB:              ${POSTGRES_DB}
      POSTGRES_USER:            ${POSTGRES_USER}
      POSTGRES_PASSWORD:        ${POSTGRES_PASSWORD}
      POSTGRES_SSLMODE:         ${POSTGRES_SSLMODE}
      JWT_SECRET:               ${JWT_SECRET}
      JWT_ISSUER:               ${JWT_ISSUER}
      JWT_ACCESS_TTL:           ${JWT_ACCESS_TTL}
      GAME_TOKEN_SECRET:        ${GAME_TOKEN_SECRET}
      GAME_SERVER_PUBLIC_HOST:  ${GAME_SERVER_PUBLIC_HOST:-game-server}
      GAME_SERVER_PUBLIC_PORT:  ${GAME_SERVER_PUBLIC_PORT:-7000}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Healthcheck omitted intentionally — the distroless image does
    # not ship curl/wget. Use docker-compose-level TCP probe or rely
    # on the migrate step + depends_on ordering.

  # ─── game-server ────────────────────────────────────────────────────
  game-server:
    <<: *defaults
    build:
      context: .
      dockerfile: Dockerfile.game-server
    image: racing-game-backend/game-server:dev
    container_name: racing-game-server
    environment:
      APP_ENV:           ${APP_ENV}
      LOG_LEVEL:         ${LOG_LEVEL}
      GAME_SERVER_PORT:  "7000"
      POSTGRES_HOST:     postgres
      POSTGRES_PORT:     "5432"
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SSLMODE:  ${POSTGRES_SSLMODE}
      GAME_TOKEN_SECRET: ${GAME_TOKEN_SECRET}
    ports:
      - "7000:7000/udp"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # UDP has no HTTP healthcheck. `pgrep` would require a shell we
    # don't have. Rely on docker restart policy and explicit smoke
    # tests (go run ./cmd/udp-client).

  # ─── nginx ──────────────────────────────────────────────────────────
  nginx:
    <<: *defaults
    image: nginx:1.27-alpine
    container_name: racing-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8081:80"
    depends_on:
      - backend-api

  # ─── cloudflared (optional, Spec 22) ────────────────────────────────
  # Wraps the API in a Cloudflare Tunnel so external clients can reach
  # it over HTTPS via a stable hostname without opening firewall ports.
  #
  # Two modes, controlled by TUNNEL_MODE in `.env`:
  #
  #   quick  — cloudflared tunnel --url http://backend-api:8080
  #            → prints an ephemeral `*.trycloudflare.com` URL on
  #            startup. No credentials, no DNS, no account needed.
  #            Perfect for demos / CI / pointing a teammate's build
  #            at your laptop.
  #
  #   named  — cloudflared tunnel run with a real tunnel credentials
  #            file under ./cloudflared/. Requires
  #            `scripts/setup-tunnel.sh` to have been run on the
  #            host at least once.
  #
  # The cloudflared container reads TUNNEL_MODE at startup; toggling
  # the env var and `docker compose up -d --force-recreate cloudflared`
  # is enough to switch modes.
  cloudflared:
    build:
      context: .
      dockerfile: Dockerfile.cloudflared
    image: racing-game-backend/cloudflared:dev
    container_name: racing-cloudflared
    init: true
    entrypoint: /entrypoint.sh
    environment:
      TUNNEL_MODE:    ${TUNNEL_MODE:-quick}
      TUNNEL_DOMAIN:  ${TUNNEL_DOMAIN:-}
      TUNNEL_TOKEN:   ${TUNNEL_TOKEN:-}
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
      - ./scripts/cloudflared-entrypoint.sh:/entrypoint.sh:ro
    networks:
      - racing-network
    depends_on:
      - backend-api
    restart: unless-stopped
    # No healthcheck: cloudflared's metrics port is bound to
    # localhost inside the container; use `docker logs
    # racing-cloudflared` to verify it's up.

# ─── Networks ─────────────────────────────────────────────────────────
networks:
  racing-network:
    driver: bridge

# ─── Volumes ──────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local