openapi: 3.0.3
info:
  title: Racing Game Backend API
  version: 0.3.0
  description: |
    REST surface of the multiplayer racing-game backend MVP.
    Auth uses JWT Bearer tokens issued by `/auth/*`. Real-time
    race traffic travels over a separate UDP channel (see the
    `protocol/game.proto` message definitions).
servers:
  - url: http://localhost:8081/api/v1
    description: Local Docker Compose (nginx on host port 8081)

tags:
  - name: meta
  - name: auth
  - name: player
  - name: cars
  - name: garage
  - name: tracks
  - name: matchmaking

paths:
  /health:
    get:
      tags: [meta]
      summary: Health probe
      responses:
        '200':
          description: service is up; reports DB state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /auth/register:
    post:
      tags: [auth]
      summary: Register email/password account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: email already taken
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/login:
    post:
      tags: [auth]
      summary: Exchange credentials for an access token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/guest:
    post:
      tags: [auth]
      summary: Mint a guest account
      responses:
        '201':
          description: guest created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }

  /players/me:
    get:
      tags: [player]
      summary: Get the authenticated player profile
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /cars:
    get:
      tags: [cars]
      summary: List the global car catalog
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Car' }

  /cars/{id}:
    get:
      tags: [cars]
      summary: Get a single car by UUID
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Car' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /garage:
    get:
      tags: [garage]
      summary: List cars owned by the authenticated player
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GarageEntry' }

  /tracks:
    get:
      tags: [tracks]
      summary: List the global track catalog
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Track' }

  /tracks/{id}:
    get:
      tags: [tracks]
      summary: Get a single track by UUID
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Track' }
        '404': { $ref: '#/components/responses/NotFound' }

  /matchmaking/join:
    post:
      tags: [matchmaking]
      summary: Ask the API for a (matchId, game_token, gameServer) tuple
      description: |
        MVP matchmaking: as soon as a player asks, the service either
        returns the first pending match with capacity left or creates
        a new one. The returned `gameToken` is HMAC-SHA256-signed and
        TTL=5m; it must be presented to the Game Server over UDP in
        a length-prefixed `JoinRaceRequest`.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503':
          description: no game server configured or all matches full
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }

  /players/me/races:
    get:
      tags: [player]
      summary: Recent races for the authenticated player
      description: |
        Keyset-paginated by `finished_at`. Default page size 20,
        max 100. `cursor` is the RFC3339 finished_at of the last
        race of the previous page.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 20, maximum: 100 }
        - in: query
          name: cursor
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerRaceHistoryPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /races/{id}:
    get:
      tags: [matchmaking]
      summary: Full detail of a single race (incl. results)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RaceDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /leaderboard:
    get:
      tags: [matchmaking]
      summary: Top-N best laps on a track (default 10, max 100)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: trackId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: limit
          schema: { type: integer, default: 10, maximum: 100 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaderboardResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: bad request
      content:
        application/json: { schema: { $ref: '#/components/schemas/Error' } }
    Unauthorized:
      description: missing or invalid token
      content:
        application/json: { schema: { $ref: '#/components/schemas/Error' } }
    NotFound:
      description: resource not found
      content:
        application/json: { schema: { $ref: '#/components/schemas/Error' } }
  schemas:
    Error:
      type: object
      properties: { error: { type: string } }
    Health:
      type: object
      properties:
        status: { type: string, example: ok }
        db:    { type: string, example: up, enum: [up, down, unknown] }
    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email:       { type: string, format: email }
        password:    { type: string, minLength: 8, maxLength: 128 }
        displayName: { type: string, minLength: 1, maxLength: 32 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:    { type: string, format: email }
        password: { type: string }
    AuthResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, playerId, userId, displayName, isGuest]
      properties:
        accessToken: { type: string }
        tokenType:   { type: string, example: Bearer }
        expiresIn:   { type: integer, description: seconds until expiry }
        playerId:    { type: string, format: uuid }
        userId:      { type: string, format: uuid }
        displayName: { type: string }
        isGuest:     { type: boolean }
    PlayerProfile:
      type: object
      properties:
        playerId:    { type: string, format: uuid }
        userId:      { type: string, format: uuid }
        displayName: { type: string }
        avatarUrl:   { type: string, nullable: true }
        isGuest:     { type: boolean }
        createdAt:   { type: string, format: date-time }
        lastLoginAt: { type: string, format: date-time, nullable: true }
    Car:
      type: object
      properties:
        carId:     { type: string, format: uuid }
        name:      { type: string }
        baseStats: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    GarageEntry:
      type: object
      properties:
        playerCarId:    { type: string, format: uuid }
        carId:          { type: string, format: uuid }
        name:           { type: string }
        acquiredAt:     { type: string, format: date-time }
        customizations: { type: object, additionalProperties: true }
    Track:
      type: object
      properties:
        trackId:   { type: string, format: uuid }
        name:      { type: string }
        layout:    { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    MatchInfo:
      type: object
      required: [matchId, gameServerHost, gameServerPort, gameToken, expiresAt]
      properties:
        matchId:        { type: string, format: uuid }
        gameServerHost: { type: string, example: game-server }
        gameServerPort: { type: integer, example: 7000 }
        gameToken:      { type: string, description: "HMAC-signed, base64url(payload).base64url(sig); TTL ~5 min" }
        expiresAt:      { type: string, format: date-time }
    PlayerRaceHistoryPage:
      type: object
      properties:
        races: { type: array, items: { $ref: '#/components/schemas/PlayerRaceSummary' } }
        nextCursor: { type: string, format: date-time, nullable: true }
    PlayerRaceSummary:
      type: object
      properties:
        raceId: { type: string, format: uuid }
        trackId: { type: string, format: uuid }
        trackName: { type: string }
        finishedAt: { type: string, format: date-time, nullable: true }
        position: { type: integer }
        totalTimeMs: { type: integer }
        bestLapMs: { type: integer }
    RaceDetail:
      type: object
      properties:
        raceId: { type: string, format: uuid }
        trackId: { type: string, format: uuid }
        trackName: { type: string }
        status: { type: string, enum: [pending, in_progress, finished, cancelled] }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
        results:
          type: array
          items: { $ref: '#/components/schemas/RaceResultRow' }
    RaceResultRow:
      type: object
      properties:
        playerId: { type: string, format: uuid }
        displayName: { type: string }
        position: { type: integer }
        totalTimeMs: { type: integer }
        bestLapMs: { type: integer }
    LeaderboardResponse:
      type: object
      properties:
        trackId: { type: string, format: uuid }
        trackName: { type: string }
        entries:
          type: array
          items: { $ref: '#/components/schemas/LeaderboardEntry' }
    LeaderboardEntry:
      type: object
      properties:
        rank: { type: integer }
        playerId: { type: string, format: uuid }
        displayName: { type: string }
        bestLapMs: { type: integer }
        achievedAt: { type: string, format: date-time, nullable: true }
